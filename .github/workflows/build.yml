# Builds the claude-ops image and publishes it to GitHub's container registry:
#   ghcr.io/anzhe778/claude-ops:latest
# Runs when the files change, on the 1st of every month (security updates + fresh Chromium), or by hand (Actions tab).
# The NAS pulls it like any other image; Watchtower updates it automatically.
name: build
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/claude-ops:latest
            ghcr.io/${{ github.repository_owner }}/claude-ops:${{ github.run_number }}
